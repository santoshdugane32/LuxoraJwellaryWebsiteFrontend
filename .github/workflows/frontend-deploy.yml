
name: LUXORA Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: jwellary-frontend-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4

      - name: Verify Frontend Files
        run: |
          test -f Dockerfile
          test -f package.json

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --pull \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push Frontend Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME
          script: |
            set -eu

            IMAGE="$DOCKERHUB_USERNAME/jwellary-frontend-web:latest"

            echo "Pulling latest frontend image..."
            docker pull "$IMAGE"

            echo "Checking port 80..."
            if docker ps --format '{{.Names}}' | grep -qx 'luxora-frontend'; then
              docker stop luxora-frontend
              docker rm luxora-frontend
            fi

            echo "Starting frontend..."
            docker run -d \
              --name luxora-frontend \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            sleep 5

            if [ "$(docker inspect -f '{{.State.Running}}' luxora-frontend)" != "true" ]; then
              docker logs --tail 100 luxora-frontend || true
              exit 1
            fi

            echo "Frontend container is running:"
            docker ps --filter name=luxora-frontend

            echo "Recent frontend logs:"
            docker logs --tail 30 luxora-frontend
