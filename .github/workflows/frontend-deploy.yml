name: LUXORA Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: jwellary-frontend-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Frontend Code
        uses: actions/checkout@v4

      - name: Verify Frontend Files
        run: |
          test -f Dockerfile
          test -f package.json
          test -f .env.production

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --pull \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push Frontend Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME
          script: |
            set -eu

            IMAGE="$DOCKERHUB_USERNAME/jwellary-frontend-web:latest"

            docker pull "$IMAGE"

            docker rm -f luxora-frontend 2>/dev/null || true

            docker run -d \
              --name luxora-frontend \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"

            sleep 5

            if [ "$(docker inspect -f '{{.State.Running}}' luxora-frontend)" != "true" ]; then
              docker logs --tail 100 luxora-frontend
              exit 1
            fi

            docker ps --filter name=luxora-frontend
            docker logs --tail 30 luxora-frontend